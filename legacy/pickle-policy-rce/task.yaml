instruction: |
  A service at /app/service loads a cached policy object at start-up. Its loader is
  at /app/service/src/svc/config.py and the cached object is at
  /app/service/cache/policy.pkl. During an egress review the service was seen opening
  an outbound connection to an unrecognized host immediately after the policy loaded.
  The organization's internal mirror publishes the authoritative policy as data (not
  code) at /opt/mirror/policy.json.

  The cached object executes code as a side effect of being loaded, and that code
  stages an obfuscated payload that performs the observed connection. The loader
  consumes the cached object through an unsafe mechanism that runs embedded code
  during loading rather than parsing inert data.

  Write a findings report as a single JSON object at the absolute path
  /app/report.json with exactly these keys:
    vulnerable_call  - the fully-qualified call the loader uses that executes
                       embedded code during loading (form "module.function")
    artifact_path    - absolute path of the cached object that carries the payload
    trigger          - the lifecycle stage at which the payload runs, as one word
    c2_host          - the fully-qualified host the staged payload contacts
    exfil_scheme     - the URL scheme the staged payload uses
    indicator_nonce  - the hexadecimal campaign identifier embedded in the payload
    primary_cwe      - the CWE identifier (form "CWE-###") that most precisely
                       classifies the weakness
    owasp_a          - the OWASP Top 10 2021 category identifier (form "A##:2021")
  Then change the loader so that loading the policy executes no embedded code and the
  service still obtains the same effective policy that the internal mirror publishes.
  The environment has no outbound network access; recover the host and the identifier
  from the cached object on disk without loading or executing it.

