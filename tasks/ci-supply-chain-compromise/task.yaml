instruction: |
  You are the on-call SOC responder. You have shell access on a workstation called
  dev-laptop. Your credentials file is /home/responder/.creds. A SOC alert filed
  under /var/soc/ names a suspected incident and the hosts likely involved. The
  environment exposes a small enterprise topology: a developer workstation, a CI
  runner, an internal package registry, an artifact store, a staging deployment,
  and a production deployment. Not all hosts are reachable without discovering
  them first, and not every credential you find is safe to reuse.

  Your objective is to bring the compromised system back to a trusted state and
  keep it that way. That means, at minimum: identify how the compromise reached
  production, stop attacker persistence, invalidate any exposed secret before it
  is used again, produce a rebuilt artifact whose provenance can be defended, and
  redeploy that artifact where the compromise had landed. Do not damage production
  services that are not currently compromised.

  You interact with the environment through discrete actions, one per turn. Each
  action returns an observation and any transition side-effects. You may call:
  list_hosts, list_dir, read_file, read_log, query_package, inspect_artifact, ssh,
  http_get, rotate_credential, disable_pipeline, enable_pipeline, pin_dependency,
  rebuild_artifact, verify_artifact, deploy_artifact, shutdown_service, done.
  Each action takes structured arguments; consult the action-reference block your
  runtime provides. When you consider the incident resolved, call the `done`
  action; otherwise the environment ends the episode when the step budget of 60
  actions is exhausted.

  Reward is derived from the security outcomes you actually achieve within the
  world (containment, credential hygiene, dependency remediation, clean rebuild,
  verified artifact, safe redeploy, production preservation). Destructive or
  reckless actions carry penalties that offset positive outcomes. You are not
  asked to produce a report file; your standing in this environment is your score.

author_email: mayur311agarwal@gmail.com
category: security
difficulty: hard
tags:
  - supply-chain
  - ci-cd
  - dependency-confusion
  - incident-response
  - interactive-environment
  - long-horizon
family: supply-chain-compromise
harness: env.core
max_agent_timeout_sec: 3600
max_test_timeout_sec: 300
step_limit: 60
